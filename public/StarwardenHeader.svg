<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="440" height="80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0316"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="0.5" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7c0f"/>
      <stop offset="0.5" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="438" height="78" rx="10" fill="url(#bg)" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="24" cy="14" r="1.1" opacity="0.8"/>
    <circle cx="52" cy="60" r="1" opacity="0.6"/>
    <circle cx="90" cy="20" r="1.3" opacity="0.7"/>
    <circle cx="130" cy="66" r="1" opacity="0.5"/>
    <circle cx="16" cy="46" r="1" opacity="0.6"/>
    <circle cx="200" cy="12" r="1.1" opacity="0.6"/>
    <circle cx="340" cy="18" r="1.2" opacity="0.7"/>
    <circle cx="380" cy="58" r="1" opacity="0.5"/>
    <circle cx="410" cy="26" r="1.3" opacity="0.8"/>
    <circle cx="360" cy="42" r="1" opacity="0.5"/>
  </g>

  <!-- chromatic drop-shadow layers behind the main title, classic arcade marquee look -->
  <text x="26" y="52" font-family="'Courier New', monospace" font-weight="700" font-size="34" letter-spacing="2" fill="#f472b6" opacity="0.55">STARWARDEN</text>
  <text x="22" y="48" font-family="'Courier New', monospace" font-weight="700" font-size="34" letter-spacing="2" fill="#22d3ee" opacity="0.55">STARWARDEN</text>
  <text x="24" y="50" font-family="'Courier New', monospace" font-weight="700" font-size="34" letter-spacing="2" fill="url(#titleFill)" filter="url(#glow)">STARWARDEN</text>

  <!-- small ship, right side -->
  <g transform="translate(400,40) scale(1.15)">
    <path d="M -6 -11 L -22 -23 L -14 -7 Z" fill="#4d7c0f" stroke="#a3e635" stroke-width="0.6"/>
    <path d="M -6 11 L -22 23 L -14 7 Z" fill="#4d7c0f" stroke="#a3e635" stroke-width="0.6"/>
    <path d="M 15 0 L -3 -10.5 L -15 -8 L -8 0 L -15 8 L -3 10.5 Z" fill="url(#hullGrad)" stroke="#ecfccb" stroke-width="1"/>
    <ellipse cx="3" cy="0" rx="6" ry="4.2" fill="#0369a1"/>
    <ellipse cx="4" cy="-1" rx="2.6" ry="1.8" fill="#e0f2fe"/>
    <path d="M -15 -3 L -30 0 L -15 3 Z" fill="#fbbf24" opacity="0.85"/>
  </g>

  <rect x="1" y="1" width="438" height="78" rx="10" fill="url(#scanlines)"/>
</svg>
